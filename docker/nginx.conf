server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Configuração gerada na inicialização: nunca em cache
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Arquivos com hash do Vite podem ficar em cache por muito tempo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota do React cai no index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
