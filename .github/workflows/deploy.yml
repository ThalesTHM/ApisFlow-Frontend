name: deploy

# Entrega contínua:
#   push em staging    -> homologação (automático)
#   push em production -> produção (aprovação manual no GitHub Environment "production")
# A URL da API não entra no build: vem da variável API_URL da task, gravada em
# /config.js quando o container inicia, então a mesma imagem serve os dois ambientes.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'homolog' }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push image (tag = SHA do commit)
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$REPO:$IMAGE_TAG" .
          docker push "$REPO:$IMAGE_TAG"
          echo "IMAGE=$REPO:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: register task definition
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_CLUSTER }}-frontend" --query taskDefinition \
            | jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy)' > td.json
          echo "FRONTEND_TD=$(aws ecs register-task-definition --cli-input-json file://td.json \
            --query taskDefinition.taskDefinitionArn --output text)" >> "$GITHUB_ENV"

      # Circuit breaker no serviço reverte sozinho se as novas tasks não ficarem saudáveis.
      - name: deploy frontend service
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service frontend \
            --task-definition "$FRONTEND_TD" --query service.serviceName --output text
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services frontend
